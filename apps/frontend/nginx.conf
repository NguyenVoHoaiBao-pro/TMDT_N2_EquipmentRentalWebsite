server {
    listen 80;
    server_name localhost;

    # --- Turn on GZIP config here:
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";
    # ------------------------------------

    # Turn off log local to avoid increase memory usage:
    access_log off;

    # 1. Identify config for static files and fix error 404 when the the browser reloaded:
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Config store cache memory for static files:
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        log_not_found off;
    }

    # 2. Set up proxy for api:
    location /api/ {
        proxy_pass http://equipment-rental-backend:8080/equipment_rental/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        client_max_body_size 10m;
    }

    # 3. Config proxy for web socket chat:
    location /ws-chat/ {
        proxy_pass http://equipment-rental-backend:8080/equipment_rental/ws-chat/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
    }
}
