spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: equipment-rental-backend

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: none

    show-sql: false
    properties:
      hibernate:
        '[format_sql]': true

      # Defer database initialization until Spring Boot starts
    defer-datasource-initialization: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email-address}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  sql:
    init:
      mode: always # Run SQL scripts on application startup
      schema-locations: classpath:database/schema.sql
      data-locations:
        - classpath:database/seed_roles.sql # 3 Roles
        - classpath:database/seed_users.sql # About 1000 lines of users generated by script
        - classpath:database/seed_user_social_accounts.sql
        - classpath:database/seed_products.sql
  #        - classpath:database/seed_orders.sql # Nothing here yet

  # Database Configuration - MySQL (from .env)
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:equipment_rental_db}?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis Configuration (from .env)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # H2 Console (for development/testing)
  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            scope:
              - profile
              - email
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:your-facebook-client-id}
            client-secret: ${FACEBOOK_CLIENT_SECRET:your-facebook-client-secret}
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            scope:
              - public_profile
              - email


# JWT Configuration (from .env)
app:
  jwt:
    secretKey: ${JWT_SECRET:MySecretKeyThatIsAtLeast32CharactersLongForHS256}
    accessTokenExpirationMs: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refreshTokenExpirationMs: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  oauth2:
    authorized-redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}


# Logging Configuration (from .env)
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    '[com.example]': ${APP_LOG_LEVEL:INFO}
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: '%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'

# Server Configuration (from .env)
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /equipment_rental
    session:
      cookie:
        same-site: lax
        secure: false

# Swagger UI / SpringDoc Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    use-root-path: false
    display-request-duration: true
    disable-swagger-default-url: false
    doc-expansion: list
  show-actuator: false
  api-docs.groups.enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

cloudinary:
  cloudName: ${CLOUDINARY_CLOUD_NAME:your-cloud-name}
  apiKey: ${CLOUDINARY_API_KEY:your-api-key}
  apiSecret: ${CLOUDINARY_API_SECRET:your-api-secret}
