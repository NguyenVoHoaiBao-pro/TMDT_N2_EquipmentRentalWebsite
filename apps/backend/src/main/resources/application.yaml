spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: equipment-rental-backend


  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        '[format_sql]': true

  # Database Configuration - MySQL (from .env)
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:equipment_rental_db}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # H2 Console (for development/testing)
  h2:
    console:
      enabled: true
      path: /h2-console

# JWT Configuration (from .env)
app:
  jwtSecret: ${JWT_SECRET:MySecretKeyThatIsAtLeast32CharactersLongForHS256}
  jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000}

# Logging Configuration (from .env)
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    '[com.example]': ${APP_LOG_LEVEL:INFO}
  pattern:
    console: '%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'

# Server Configuration (from .env)
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# Swagger UI / SpringDoc Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    use-root-path: true
    display-request-duration: true
    disable-swagger-default-url: false
    doc-expansion: list
  show-actuator: false
  api-docs.groups.enabled: true
