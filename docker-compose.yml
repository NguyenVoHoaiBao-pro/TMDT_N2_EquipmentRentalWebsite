services:
  mysql:
    image: mysql:8.0
    container_name: equipment-rental-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: equipment_rental_user
      MYSQL_PASSWORD: ${DB_USER_PASSWORD}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}" ]
      timeout: 20s
      retries: 10
      interval: 10s
    networks:
      - equipment-rental-network

  redis:
    image: redis:7-alpine
    container_name: equipment-rental-cache
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      timeout: 3s
      retries: 5
      interval: 5s
#      disable: true
    networks:
      - equipment-rental-network

  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    container_name: equipment-rental-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
#    env_file:
#      - ./apps/backend/.env
    environment:
      environment:
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      JAVA_OPTS: '-Xmx512m -Xms256m -Ddebug=true'
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
#      DB_USER: equipment_rental_user
      DB_USER: root
      DB_PASSWORD: ${DB_USER_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379

      SERVER_PORT: 8080
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: "DEBUG"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: "DEBUG"
      APP_FLYWAY_AUTO_REPAIR: false
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FACEBOOK_CLIENT_ID: "${FACEBOOK_CLIENT_ID}"
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FACEBOOK_CLIENT_SECRET: "${FACEBOOK_CLIENT_SECRET}"
    ports:
      - '8080:8080'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - equipment-rental-network

  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
    container_name: equipment-rental-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - equipment-rental-network

volumes:
  mysql_data:
  redis_data:

networks:
  equipment-rental-network:
    driver: bridge
