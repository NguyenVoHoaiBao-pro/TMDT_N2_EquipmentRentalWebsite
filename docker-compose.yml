services:
  mysql:
    image: mysql:8.0
    container_name: equipment-rental-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-equipment_rental_db}
      MYSQL_USER: ${DB_USER:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ 'CMD', 'mysqladmin', 'ping', '-h', 'localhost' ]
      timeout: 20s
      retries: 10
      interval: 10s
    networks:
      - equipment-rental-network

  redis:
    image: redis:7-alpine
    container_name: equipment-rental-cache
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      timeout: 3s
      retries: 5
      interval: 5s
    networks:
      - equipment-rental-network

  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    container_name: equipment-rental-backend
    restart: unless-stopped
    # CHỈ GIỮ LẠI CÁC BIẾN MẠNG NỘI BỘ, KHÔNG ĐỂ BIẾN ${} BỊ TRỐNG Ở ĐÂY
    environment:
      JAVA_OPTS: '-Xmx512m -Xms256m'
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
    ports:
      - '8080:8080'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - equipment-rental-network

  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
    container_name: equipment-rental-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - equipment-rental-network

volumes:
  mysql_data:
  redis_data:

networks:
  equipment-rental-network:
    driver: bridge
