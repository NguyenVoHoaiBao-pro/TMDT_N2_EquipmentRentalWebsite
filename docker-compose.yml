version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0-alpine
    container_name: equipment-rental-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-demo_db}
      MYSQL_USER: ${DB_USER:-demo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 20s
      retries: 10
      interval: 10s
    networks:
      - equipment-rental-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: equipment-rental-cache
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      timeout: 3s
      retries: 5
      interval: 5s
    networks:
      - equipment-rental-network

  # Backend API
  backend:
    build:
      context: ./apps/backend/demo
      dockerfile: Dockerfile
    container_name: equipment-rental-backend
    restart: unless-stopped
    environment:
      JAVA_OPTS: '-Xmx512m -Xms256m'
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-demo_db}
      DB_USER: ${DB_USER:-demo}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-YourSuperSecretKeyMin32CharsLongPassword1234567890}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    ports:
      - '8080:8080'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/swagger-ui.html']
      timeout: 3s
      retries: 5
      interval: 10s
    networks:
      - equipment-rental-network

  # Frontend
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: equipment-rental-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:8080
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/']
      timeout: 3s
      retries: 5
      interval: 10s
    networks:
      - equipment-rental-network

volumes:
  mysql_data:
  redis_data:

networks:
  equipment-rental-network:
    driver: bridge
